<script>

/* =========================================================
   SISPDV PRO - SISTEMA FUNCIONAL
========================================================= */

let cart = [];
let descontoAtual = 0;

let produtos = [];
let clientes = [];
let financeiro = [];
let estoqueGeral = [];

let caixa = {
    saldo: 0,
    lucro: 0
};

/* =========================================================
   INIT
========================================================= */

document.addEventListener('DOMContentLoaded', () => {

    carregarDados();

    renderTudo();

    iniciarMenuMobile();

});

/* =========================================================
   STORAGE
========================================================= */

function carregarDados() {

    const dados = localStorage.getItem('sisPDV_Dados');

    if (dados) {

        const db = JSON.parse(dados);

        produtos = db.produtos || [];
        clientes = db.clientes || [];
        financeiro = db.financeiro || [];
        estoqueGeral = db.estoqueGeral || [];
        caixa = db.caixa || { saldo:0, lucro:0 };

    } else {

        gerarDadosIniciais();

    }

}

function salvarDados() {

    localStorage.setItem('sisPDV_Dados', JSON.stringify({
        produtos,
        clientes,
        financeiro,
        estoqueGeral,
        caixa
    }));

}

/* =========================================================
   DADOS EXEMPLO
========================================================= */

function gerarDadosIniciais() {

    produtos = [
        {
            id: 1,
            cod: '78910001',
            nome: 'Coca Cola Lata',
            categoria: 'Bebidas',
            marca: 'Coca-Cola',
            un: 'UN',
            custo: 3,
            venda: 6,
            estMin: 5
        },

        {
            id: 2,
            cod: '78910002',
            nome: 'Arroz 5kg',
            categoria: 'Alimentos',
            marca: 'Camil',
            un: 'UN',
            custo: 18,
            venda: 29.9,
            estMin: 3
        }
    ];

    estoqueGeral = produtos.map(p => ({
        ...p,
        quantidade: 20
    }));

}

/* =========================================================
   RENDER GLOBAL
========================================================= */

function renderTudo() {

    renderProdutosPDV();
    renderCarrinho();

    renderEstoque();

    renderFinanceiro();

    renderClientes();

    renderProdutosCadastro();

}

/* =========================================================
   UTIL
========================================================= */

function moeda(valor) {

    return Number(valor || 0)
        .toFixed(2)
        .replace('.', ',');

}

function showSection(event, id) {

    document.querySelectorAll('.section')
        .forEach(sec => sec.classList.add('hidden'));

    document.getElementById('section-' + id)
        .classList.remove('hidden');

    document.querySelectorAll('.menu-btn')
        .forEach(btn => btn.classList.remove('active'));

    event.currentTarget.classList.add('active');

}

/* =========================================================
   PDV
========================================================= */

function renderProdutosPDV() {

    const grid = document.getElementById('products-grid');

    grid.innerHTML = '';

    produtos.forEach(prod => {

        const estoque = estoqueGeral.find(e => e.cod === prod.cod);

        const qtd = estoque?.quantidade || 0;

        const div = document.createElement('div');

        div.className = 'produto-card';

        div.innerHTML = `
            <strong>${prod.nome}</strong>

            <div style="margin:6px 0;">
                R$ ${moeda(prod.venda)}
            </div>

            <small>
                Estoque: ${qtd}
            </small>
        `;

        div.onclick = () => adicionarCarrinho(prod.cod);

        grid.appendChild(div);

    });

}

function adicionarCarrinho(cod) {

    const produto = produtos.find(p => p.cod === cod);

    const estoque = estoqueGeral.find(e => e.cod === cod);

    if (!produto || !estoque) return;

    if (estoque.quantidade <= 0) {

        alert('Sem estoque.');

        return;

    }

    const existe = cart.find(i => i.cod === cod);

    if (existe) {

        if (existe.qtd >= estoque.quantidade) {

            alert('Quantidade indisponível.');

            return;

        }

        existe.qtd++;

    } else {

        cart.push({
            ...produto,
            qtd: 1
        });

    }

    renderCarrinho();

}

function renderCarrinho() {

    const area = document.getElementById('cart-items');

    area.innerHTML = '';

    if (!cart.length) {

        area.innerHTML = `
            <div style="padding:20px;text-align:center;color:#999;">
                Carrinho vazio
            </div>
        `;

    }

    let subtotal = 0;

    cart.forEach((item, index) => {

        const total = item.qtd * item.venda;

        subtotal += total;

        area.innerHTML += `
            <div class="cart-item">

                <div>
                    <strong>${item.qtd}x</strong>
                    ${item.nome}
                </div>

                <div>
                    R$ ${moeda(total)}

                    <button
                        class="btn btn-sm btn-danger"
                        onclick="removerItem(${index})"
                    >
                        ✕
                    </button>
                </div>

            </div>
        `;

    });

    const desconto = subtotal * (descontoAtual / 100);

    const totalFinal = subtotal - desconto;

    document.getElementById('cart-total')
        .innerText = moeda(totalFinal);

}

function removerItem(index) {

    if (!cart[index]) return;

    if (cart[index].qtd > 1) {

        cart[index].qtd--;

    } else {

        cart.splice(index, 1);

    }

    renderCarrinho();

}

function buscarCodigo() {

    const codigo = document
        .getElementById('barcode-input')
        .value
        .trim();

    if (!codigo) return;

    const produto = produtos.find(p =>
        p.cod.includes(codigo) ||
        p.nome.toLowerCase().includes(codigo.toLowerCase())
    );

    if (!produto) {

        alert('Produto não encontrado.');

        return;

    }

    adicionarCarrinho(produto.cod);

    document.getElementById('barcode-input').value = '';

}

function handleBarcode(e) {

    if (e.key === 'Enter') {

        buscarCodigo();

    }

}

function aplicarDesconto() {

    const valor = prompt(
        'Desconto (%)',
        descontoAtual
    );

    if (valor === null) return;

    descontoAtual = Number(valor) || 0;

    renderCarrinho();

}

function finalizarVenda(tipo) {

    if (!cart.length) {

        alert('Carrinho vazio.');

        return;

    }

    let subtotal = 0;
    let custoTotal = 0;

    cart.forEach(item => {

        subtotal += item.venda * item.qtd;

        custoTotal += item.custo * item.qtd;

        const estoque = estoqueGeral.find(
            e => e.cod === item.cod
        );

        estoque.quantidade -= item.qtd;

    });

    const desconto = subtotal * (descontoAtual / 100);

    const totalFinal = subtotal - desconto;

    caixa.saldo += totalFinal;

    caixa.lucro += (totalFinal - custoTotal);

    financeiro.push({

        data: new Date().toLocaleString(),

        tipo: 'Venda',

        desc: `Venda via ${tipo}`,

        valor: totalFinal

    });

    cart = [];

    descontoAtual = 0;

    salvarDados();

    renderTudo();

    alert('Venda finalizada.');

}

/* =========================================================
   ESTOQUE
========================================================= */

function renderEstoque() {

    const tbody = document.getElementById('estoque-tabela');

    tbody.innerHTML = '';

    estoqueGeral.forEach((p, index) => {

        tbody.innerHTML += `
            <tr>

                <td>${p.cod}</td>

                <td>${p.nome}</td>

                <td>${p.categoria}</td>

                <td>
                    ${p.quantidade}
                </td>

                <td>
                    R$ ${moeda(p.custo)}
                </td>

                <td>
                    R$ ${moeda(p.venda)}
                </td>

                <td>

                    <button
                        class="btn btn-sm btn-danger"
                        onclick="alterarEstoque(${index}, -1)"
                    >
                        -
                    </button>

                    <button
                        class="btn btn-sm btn-success"
                        onclick="alterarEstoque(${index}, 1)"
                    >
                        +
                    </button>

                </td>

            </tr>
        `;

    });

}

function alterarEstoque(index, delta) {

    estoqueGeral[index].quantidade += delta;

    if (estoqueGeral[index].quantidade < 0) {

        estoqueGeral[index].quantidade = 0;

    }

    salvarDados();

    renderEstoque();

    renderProdutosPDV();

}

/* =========================================================
   FINANCEIRO
========================================================= */

function renderFinanceiro() {

    document.getElementById('fin-saldo-dia')
        .innerText = moeda(caixa.saldo);

    document.getElementById('fin-lucro')
        .innerText = moeda(caixa.lucro);

    const tabela = document.getElementById('fluxo-tabela');

    tabela.innerHTML = '';

    financeiro.slice().reverse().forEach(f => {

        tabela.innerHTML += `
            <tr>

                <td>${f.data}</td>

                <td>${f.tipo}</td>

                <td>${f.desc}</td>

                <td>
                    R$ ${moeda(f.valor)}
                </td>

            </tr>
        `;

    });

}

function registrarFin() {

    const tipo = document.getElementById('fin-tipo').value;

    const desc = document.getElementById('fin-desc').value;

    const valor = Number(
        document.getElementById('fin-valor').value
    );

    if (!desc || valor <= 0) {

        alert('Dados inválidos.');

        return;

    }

    const valorFinal =
        tipo === 'despesa'
        ? -valor
        : valor;

    financeiro.push({

        data: new Date().toLocaleString(),

        tipo,

        desc,

        valor: valorFinal

    });

    caixa.saldo += valorFinal;

    salvarDados();

    renderFinanceiro();

}

/* =========================================================
   CLIENTES
========================================================= */

function renderClientes() {

    const tbody = document.getElementById('clientes-tabela');

    tbody.innerHTML = '';

    clientes.forEach((c, index) => {

        tbody.innerHTML += `
            <tr>

                <td>${c.id}</td>

                <td>${c.nome}</td>

                <td>${c.cpf}</td>

                <td>${c.tel}</td>

                <td>R$ ${moeda(c.credito)}</td>

                <td>${c.pontos}</td>

                <td>R$ ${moeda(c.totalGasto)}</td>

                <td>

                    <button
                        class="btn btn-sm btn-danger"
                        onclick="excluirCliente(${index})"
                    >
                        ✕
                    </button>

                </td>

            </tr>
        `;

    });

}

function salvarCliente() {

    const nome = document
        .getElementById('client-nome')
        .value;

    if (!nome) {

        alert('Nome obrigatório.');

        return;

    }

    clientes.push({

        id: Date.now(),

        nome,

        cpf: document.getElementById('client-cpf').value,

        tel: document.getElementById('client-tel').value,

        email: document.getElementById('client-email').value,

        credito: Number(
            document.getElementById('client-credito').value
        ) || 0,

        pontos: 0,

        totalGasto: 0

    });

    salvarDados();

    renderClientes();

}

function excluirCliente(index) {

    clientes.splice(index, 1);

    salvarDados();

    renderClientes();

}

/* =========================================================
   PRODUTOS
========================================================= */

function renderProdutosCadastro() {

    const tbody = document.getElementById('produtos-tabela');

    tbody.innerHTML = '';

    produtos.forEach(p => {

        const margem =
            p.custo > 0
            ? (((p.venda - p.custo) / p.custo) * 100).toFixed(1)
            : 0;

        tbody.innerHTML += `
            <tr>

                <td>${p.cod}</td>

                <td>${p.nome}</td>

                <td>${p.categoria}</td>

                <td>${p.marca}</td>

                <td>${p.estMin}</td>

                <td>R$ ${moeda(p.custo)}</td>

                <td>R$ ${moeda(p.venda)}</td>

                <td>${margem}%</td>

            </tr>
        `;

    });

}

function salvarProduto() {

    const cod = document.getElementById('prod-codigo').value;

    const nome = document.getElementById('prod-nome').value;

    if (!cod || !nome) {

        alert('Código e nome obrigatórios.');

        return;

    }

    if (produtos.some(p => p.cod === cod)) {

        alert('Código já cadastrado.');

        return;

    }

    const produto = {

        id: Date.now(),

        cod,

        nome,

        categoria: document.getElementById('prod-categoria').value,

        marca: document.getElementById('prod-marca').value,

        un: document.getElementById('prod-unidade').value,

        estMin: Number(
            document.getElementById('prod-estoque-min').value
        ) || 0,

        custo: Number(
            document.getElementById('prod-custo').value
        ) || 0,

        venda: Number(
            document.getElementById('prod-venda').value
        ) || 0,

        ncm: document.getElementById('prod-ncm').value

    };

    produtos.push(produto);

    estoqueGeral.push({
        ...produto,
        quantidade: 0
    });

    salvarDados();

    renderProdutosCadastro();

    renderProdutosPDV();

    renderEstoque();

    alert('Produto cadastrado.');

}

/* =========================================================
   MOBILE MENU
========================================================= */

function iniciarMenuMobile() {

    const sidebar = document.querySelector('aside');

    const overlay = document.getElementById('overlay');

    const toggle = document.getElementById('toggle-sidebar');

    toggle.addEventListener('click', () => {

        if (window.innerWidth <= 768) {

            sidebar.classList.toggle('mobile-open');

            overlay.style.display =
                sidebar.classList.contains('mobile-open')
                ? 'block'
                : 'none';

        } else {

            sidebar.classList.toggle('collapsed');

        }

    });

    overlay.addEventListener('click', () => {

        sidebar.classList.remove('mobile-open');

        overlay.style.display = 'none';

    });

}

</script>
